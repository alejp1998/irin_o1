[project]
name = "irin-o1"
version = "1.0.0"
description = "IRIN O1 — e-puck A* path planner (Webots, UPM 2019) with a testable Python/JS port."
readme = "README.md"
requires-python = ">=3.9"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
include = ["astar.py", "tests/**"]
extend-exclude = ["**/__pycache__/**"]
